# PR-only static policy regression. This job never requests OIDC or signs bytes.
name: Signer source policy

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  policy:
    name: Inert signer policy tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read reviewed signer source only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check fixed non-release signer contract
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
