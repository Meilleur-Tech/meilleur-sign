# Internal QA-only OIDC trust probe. This workflow cannot sign a release.
# GitHub Free protected main, reviewed workflow, no private source or sensitive data.
name: Meilleur Sign - Protected OIDC Canary

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Fixed non-release trust probe only
        required: true
        type: choice
        options:
          - canary

permissions: {}

concurrency:
  group: meilleur-sign-oidc-canary-main
  cancel-in-progress: false

jobs:
  canary:
    name: Keyless sign and verify fixed non-release content
    if: >-
      github.repository == 'Meilleur-Tech/meilleur-sign' &&
      github.repository_id == 1464223150 &&
      github.ref == 'refs/heads/main' &&
      github.ref_protected == true &&
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'canary'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Install SHA-pinned Cosign v3.1.4
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Verify protected GitHub identity and create fixed canary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Meilleur-Tech/meilleur-sign"
          test "$GITHUB_REPOSITORY_ID" = "1464223150"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_REF_PROTECTED" = "true"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$(cosign version --json | jq -r '.GitVersion')" = "v3.1.4"
          test "$(printf %s "$GITHUB_SHA" | wc -c | tr -d ' ')" -eq 40
          jq -cn --arg source "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" \
            '{schema:"meilleur-sign-oidc-canary/v1",
              repository:"Meilleur-Tech/meilleur-sign",
              repository_id:1464223150,
              protected_ref:"refs/heads/main",
              signer_source_sha:$source,
              run_id:$run,
              not_a_release:true}' > canary.json
          chmod 0600 canary.json

      - name: Keyless sign exactly the fixed test bytes
        shell: bash
        run: |
          set -euo pipefail
          cosign sign-blob --yes --bundle canary.sigstore.json canary.json
          jq -e '
            .mediaType == "application/vnd.dev.sigstore.bundle.v0.3+json"
            and (.verificationMaterial.certificate.rawBytes | type == "string")
            and (.verificationMaterial.tlogEntries | length > 0)
          ' canary.sigstore.json >/dev/null

      - name: Verify Fulcio certificate, GitHub ref and transparency evidence
        shell: bash
        run: |
          set -euo pipefail
          cosign verify-blob \
            --bundle canary.sigstore.json \
            --certificate-identity "https://github.com/Meilleur-Tech/meilleur-sign/.github/workflows/oidc-canary.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-github-workflow-repository "Meilleur-Tech/meilleur-sign" \
            --certificate-github-workflow-ref "refs/heads/main" \
            canary.json
          echo "MEILLEUR_SIGN_CANARY_IDENTITY_VERIFIED"

      - name: Retain harmless test evidence for independent review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: meilleur-sign-oidc-canary
          path: |
            canary.json
            canary.sigstore.json
          retention-days: 3
          if-no-files-found: error
